<title>LIFE ZERO Office</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFE ZERO">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0E1524; --panel:#15203A; --panel2:#1B2846; --edge:#26375C;
  --ink:#E8EEF8; --muted:#93A6C8; --faint:#61759B;
  --gold:#E8B84B; --money:#4ADE80; --red:#F2545B; --amber:#F2A33C;
  --blue:#5FA8F5; --violet:#A98BF0; --teal:#3FD0C9;
  --floor:#6B4E3A; --floor2:#7A5B44; --wall:#2A3550; --grass:#2F7D4F;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF1F7; --panel:#FFFFFF; --panel2:#F3F6FB; --edge:#D3DCEA;
  --ink:#131A28; --muted:#4E5F7D; --faint:#7D8CA8;
  --wall:#C8D2E4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font:14px/1.5 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.px{font-family:"Silkscreen","IBM Plex Mono",monospace;letter-spacing:.02em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
button{font-family:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0);z-index:30;background:var(--panel);
  border-bottom:2px solid var(--edge)}
.top-in{display:flex;align-items:center;gap:10px;padding:8px 12px;overflow-x:auto;
  scrollbar-width:none}
.top-in::-webkit-scrollbar{display:none}
.logo{flex:0 0 auto}
.logo .n{font-size:16px;color:var(--gold)}
.logo .s{font-size:9px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.stats{display:flex;gap:6px;flex:1;min-width:0}
.stat{flex:0 0 auto;background:var(--panel2);border:1px solid var(--edge);border-radius:6px;
  padding:5px 9px;min-width:64px}
.stat dt{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0}
.stat dd{margin:1px 0 0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:600;line-height:1.15}
.stat.rev dd{color:var(--money)} .stat.exp dd{color:var(--red)} .stat.pro dd{color:var(--money)}
.stat.z dd{color:var(--muted)}
.live{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);
  white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--money);display:inline-block;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:60vh}
.nav{flex:0 0 190px;background:var(--panel);border-right:2px solid var(--edge);padding:8px 0}
.nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
  padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;text-align:left;
  border-left:3px solid transparent}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--panel2);color:var(--ink);
  border-left-color:var(--gold);font-weight:600}
.nav .ic{width:16px;text-align:center;font-size:13px}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;
  font-size:10px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.main{flex:1;min-width:0;padding:12px}
@media(max-width:860px){
  .shell{display:block}
  .nav{display:flex;overflow-x:auto;border-right:0;border-bottom:2px solid var(--edge);
    padding:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;
    padding:10px 13px;white-space:nowrap}
  .nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--gold)}
  .nav .badge{margin-left:6px}
  .main{padding:10px}
}

/* ---------- office map ---------- */
.mapwrap{background:var(--panel);border:2px solid var(--edge);border-radius:10px;
  padding:6px;overflow:auto;-webkit-overflow-scrolling:touch}
svg.map{width:100%;height:auto;display:block;min-width:620px}
.map .rname{font-family:"Silkscreen",monospace;font-size:15px;fill:var(--ink)}
.map .rsub{font-size:12px;fill:var(--faint)}
.map .seat{cursor:pointer}
.map .seat:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.map .bub{font-size:12.5px;fill:var(--ink)}
.map .empty{font-size:12.5px;fill:var(--faint);font-style:italic}
.maphint{margin:8px 2px 0;font-size:11.5px;color:var(--faint)}
@media(max-width:860px){.maphint b{color:var(--muted)}}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:10px}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:10px;overflow:hidden}
.card h3{font-family:"Silkscreen",monospace;font-size:12px;padding:9px 11px;
  border-bottom:1px solid var(--edge);color:var(--ink);display:flex;align-items:center;gap:7px}
.card h3 .n{margin-left:auto;color:var(--faint);font-size:11px}
.card .body{padding:9px 11px;max-height:260px;overflow-y:auto}
.row{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--edge);font-size:12.5px}
.row:last-child{border-bottom:0}
.row time{flex:0 0 46px;color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  padding-top:2px}
.row .d{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px}
.row p{margin:0;color:var(--muted)}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px;
  font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.gate{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--edge);
  font-size:12.5px;cursor:pointer}
.gate:last-child{border-bottom:0}
.gate .num{flex:0 0 20px;height:20px;border-radius:50%;background:var(--amber);color:#1A1200;
  font-size:10px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.gate .num.hot{background:var(--red);color:#fff}
.gate .min{margin-left:auto;color:var(--faint);white-space:nowrap;font-size:11px}
.cap{padding:8px 0;border-bottom:1px solid var(--edge);font-size:12.5px}
.cap:last-child{border-bottom:0}
.cap b{display:block;font-size:12.5px}
.cap span{color:var(--faint);font-size:11px}
.cap p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.note{font-size:11px;color:var(--faint);padding:8px 11px;border-top:1px solid var(--edge)}

/* ---------- agent panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.66);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);
  border-left:2px solid var(--edge);z-index:51;transform:translateX(101%);
  transition:transform .2s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column}
.panel.on{transform:translateX(0)}
@media(max-width:620px){
  .panel{left:0;right:0;top:auto;width:100%;height:92vh;border-left:0;border-top:2px solid var(--edge);
    border-radius:12px 12px 0 0;transform:translateY(101%)}
  .panel.on{transform:translateY(0)}
}
.ph{display:flex;gap:10px;padding:13px 14px;border-bottom:2px solid var(--edge);align-items:flex-start;
  padding-top:calc(13px + env(safe-area-inset-top,0px))}
.ph .face{flex:0 0 46px;width:46px;height:46px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--edge);display:grid;place-items:center}
.ph .face svg{width:36px;height:40px}
.ph h2{font-family:"Silkscreen",monospace;font-size:15px}
.ph .role{font-size:11.5px;color:var(--faint);margin-top:3px}
.ph .x{margin-left:auto;background:var(--panel2);border:1px solid var(--edge);color:var(--muted);
  width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 28px}
.ptabs{display:flex;gap:4px;padding:9px 14px 0}
.ptabs button{flex:1;background:var(--panel2);border:1px solid var(--edge);color:var(--muted);
  padding:6px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer;border-bottom:0}
.ptabs button[aria-selected="true"]{background:var(--blue);color:#06101F;font-weight:600;
  border-color:var(--blue)}
.pbody{flex:1;overflow-y:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0 0 12px}
.kv dt{color:var(--faint);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
/* --- approvals desk: what the chairman signs --- */
.appr{background:var(--panel);border:2px solid var(--edge);border-radius:10px;margin-bottom:12px}
.appr.top{border-color:var(--gold)}
.appr>h3{font-family:"Silkscreen",monospace;font-size:12.5px;padding:10px 12px;margin:0;
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border-bottom:2px solid var(--edge);color:var(--ink)}
.appr .mins{margin-left:auto;color:var(--amber);font-size:11px;white-space:nowrap}
.appr .press{padding:11px 12px 0;font-size:14px;color:var(--ink);font-weight:600;line-height:1.35}
.appr .gain{padding:4px 12px 0;font-size:12.5px;color:var(--muted)}
.steps{margin:10px 12px 0;padding-left:20px;font-size:13px;color:var(--ink);line-height:1.5}
.steps li{margin-bottom:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.acts button{font:inherit;font-size:12.5px;padding:9px 13px;border-radius:8px;cursor:pointer;
  border:2px solid var(--edge);background:var(--panel2);color:var(--ink);min-height:42px}
.acts button.done{border-color:var(--money);color:var(--money)}
.acts button.stuck{border-color:var(--red);color:var(--red)}
.acts button:disabled{opacity:.45;cursor:default}
.stamp{padding:0 12px 12px;font-size:12px;color:var(--muted)}
.stamp b{color:var(--money)}
.stamp.bad b{color:var(--red)}
.sec{margin-top:13px}
.sec h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:0 0 5px;font-weight:600}
.sec p{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.sec ul{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.sec li{margin-bottom:4px}
.perf{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.perf div{background:var(--panel2);border:1px solid var(--edge);border-radius:7px;padding:7px 9px}
.perf dt{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.perf dd{margin:2px 0 0;font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.perf dd.na{font-size:11px;font-weight:400;color:var(--faint);font-family:inherit;padding-top:3px}
.bubbles{display:flex;flex-direction:column;gap:9px;margin-bottom:11px}
.me{align-self:flex-end;background:var(--blue);color:#06101F;border-radius:11px 11px 3px 11px;
  padding:8px 11px;font-size:12.5px;max-width:85%;font-weight:500}
.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--edge);
  border-radius:11px 11px 11px 3px;padding:9px 11px;font-size:12.5px;max-width:92%;
  white-space:pre-wrap;line-height:1.55}
.them.err{border-color:var(--red);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.chip{background:var(--panel2);border:1px solid var(--edge);color:var(--muted);font-size:11px;
  padding:4px 9px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.askrow{display:flex;gap:6px}
.askrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--edge);
  color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit}
.askrow input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.go{background:var(--blue);border:0;color:#06101F;border-radius:8px;padding:0 15px;font-size:13px;
  font-weight:700;cursor:pointer}
.go:disabled{opacity:.45}
.modes{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:8px;
  border:1px solid var(--edge);margin-bottom:10px}
.modes button{flex:1;background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;
  font-size:12px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600}
.warn{background:rgba(242,163,60,.13);border:1px solid var(--amber);border-radius:8px;
  padding:9px 11px;font-size:11.5px;margin-bottom:9px}
.warn b{color:var(--amber)}
.obs{font-size:10.5px;color:var(--faint);margin-top:9px}
footer{padding:16px 12px 26px;font-size:10.5px;color:var(--faint);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top"><div class="top-in">
  <div class="logo px" style="display:flex;gap:9px;align-items:center"><svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true" style="flex:0 0 30px"><circle cx="50" cy="50" r="26.2" fill="none" stroke="var(--gold)" stroke-width="11.5"/><path d="M33.7 55.5 H51.3 L86.0 22.6" fill="none" stroke="var(--money)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M92.5 16.0 L88.5 30.8 L77.8 24.2 Z" fill="var(--money)"/></svg><span><span class="n" style="display:block">LIFE ZERO</span><span class="s">Autonomous Business</span></span></div>
  <dl class="stats" id="stats"></dl>
  <div class="live"><span id="asof" class="mono"></span><i></i>LIVE</div>
</div></div>

<div class="shell">
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <section id="v-office"></section>
    <section id="v-agents" hidden></section>
    <section id="v-memos" hidden></section>
    <section id="v-experiments" hidden></section>
    <section id="v-products" hidden></section>
    <section id="v-customers" hidden></section>
    <section id="v-finances" hidden></section>
    <section id="v-library" hidden></section>
    <section id="v-gates" hidden></section>
    <footer id="foot"></footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pname">
  <div class="ph">
    <div class="face" id="pface"></div>
    <div style="min-width:0"><h2 id="pname" class="px"></h2><div class="role" id="prole"></div></div>
    <button class="x" id="pclose" aria-label="Close">&times;</button>
  </div>
  <div class="ptabs" id="ptabs">
    <button data-t="chat" aria-selected="true">Chat</button>
    <button data-t="status" aria-selected="false">Status</button>
    <button data-t="perf" aria-selected="false">Performance</button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<script type="application/json" id="lz-state">__LIFEZERO_STATE__</script>
<script>
(function(){
"use strict";
var S = JSON.parse(document.getElementById("lz-state").textContent);
var $ = function(i){ return document.getElementById(i); };
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var ST = {
  WORKING:{c:"var(--money)",l:"Working"}, RESEARCHING:{c:"var(--blue)",l:"Researching"},
  WAITING:{c:"var(--amber)",l:"Waiting"}, BLOCKED:{c:"var(--red)",l:"Blocked"},
  ERROR:{c:"var(--red)",l:"Error"}, IDLE:{c:"var(--faint)",l:"Idle"},
  REVENUE:{c:"var(--money)",l:"Revenue"}
};
function st(a){ return ST[a.status] || ST.IDLE; }
function agent(id){ return S.agents.filter(function(x){return x.id===id;})[0]; }
function nameOf(id){ var a=agent(id); return a?a.display:(id==="chairman"?"Chairman":id); }
function colourOf(id){ var a=agent(id); return a?st(a).c:"var(--muted)"; }
function fmt(t){ return !t?"never":t.replace("T"," ").replace("Z","").slice(0,16)+" UTC"; }

/* ---- a little person, drawn as blocks so it reads at map scale ---- */
var PROP = {
  ceo:'<rect x="12" y="4" width="18" height="5" fill="var(--gold)"/>'+
      '<rect x="14" y="1" width="14" height="3" fill="var(--gold)"/>',
  rnd:'<rect x="30" y="16" width="10" height="3" fill="#FFF" opacity=".85"/>'+
      '<circle cx="34" cy="12" r="5" fill="none" stroke="#FFF" stroke-width="2" opacity=".85"/>',
  builder:'<rect x="4" y="30" width="34" height="4" fill="currentColor" opacity=".35"/>',
  scout:'<circle cx="33" cy="13" r="5" fill="none" stroke="#FFF" stroke-width="2" opacity=".85"/>'+
        '<rect x="36" y="17" width="6" height="2.5" transform="rotate(45 36 17)" fill="#FFF" opacity=".85"/>',
  operator:'<rect x="11" y="27" width="20" height="9" fill="var(--panel2)" stroke="currentColor" stroke-width="2"/>',
  auditor:'<path d="M21 2 L33 7 v9 c0 8-6 13-12 15-6-2-12-7-12-15 V7z" fill="none" stroke="#FFF" stroke-width="2" opacity=".8"/>',
  it:'<rect x="11" y="5" width="20" height="3" rx="1.5" fill="#E8EDF0"/>'+          /* headset band */
     '<rect x="7" y="8" width="5" height="9" rx="2" fill="#E8EDF0"/>'+
     '<rect x="30" y="8" width="5" height="9" rx="2" fill="#E8EDF0"/>'+
     '<rect x="25" y="21" width="7" height="2" rx="1" fill="#E8EDF0"/>',             /* mic boom */
  tax:'<rect x="13" y="25" width="16" height="15" rx="1" fill="#F4F1E6" stroke="#000" stroke-width="1"/>'+
      '<rect x="16" y="28" width="10" height="1.6" fill="#8894A0"/>'+
      '<rect x="16" y="31" width="10" height="1.6" fill="#8894A0"/>'+
      '<rect x="16" y="34" width="6" height="1.6" fill="#8894A0"/>'+
      '<circle cx="26" cy="36" r="3" fill="none" stroke="var(--red)" stroke-width="1.4"/>',
  cert:'<path d="M21 24 l4 5 5 1 -3.5 4 1 5 -6.5 -2.6 -6.5 2.6 1 -5 -3.5 -4 5 -1z" '+
       'fill="var(--gold)" stroke="#000" stroke-width="1"/>'+
       '<rect x="17" y="37" width="3" height="6" fill="var(--gold)"/>'+
       '<rect x="22" y="37" width="3" height="6" fill="var(--gold)"/>',
  robot:'<rect x="20" y="1" width="2" height="7" fill="#9FB3C8"/>'+                  /* antenna */
        '<circle cx="21" cy="1" r="3" fill="var(--amber)" stroke="#000" stroke-width="1"/>'+
        '<rect x="13" y="16" width="16" height="5" rx="1" fill="#1B2A3A" '+          /* visor */
        'stroke="#9FB3C8" stroke-width="1"/>'
};

/* each character has its own hair, so eight people in eight rooms read as eight
   people and not as one sprite recoloured by status */
var HAIR = {
  ceo:"#2B2118", rnd:"#6B4A2F", scout:"#8A5A3C", tax:"#3A2A22",
  cert:"#4A3A55", robot:"#9FB3C8", it:"#2F4858", auditor:"#5A2020"
};
function person(kind, c){
  var eyes = kind==="robot" ? "" :
    '<rect x="16" y="17" width="3" height="3" fill="#221A16"/>'+
    '<rect x="23" y="17" width="3" height="3" fill="#221A16"/>';
  return '<g>'+
    '<ellipse cx="21" cy="45" rx="12" ry="3" fill="#000" opacity=".28"/>'+
    '<rect x="9" y="22" width="24" height="21" rx="3" fill="'+c+'"/>'+          /* body */
    '<rect x="9" y="22" width="24" height="21" rx="3" fill="none" stroke="#000" stroke-width="1.5" opacity=".35"/>'+
    '<rect x="12" y="9" width="18" height="15" rx="4" fill="'+
      (kind==="robot"?"#C9D4DE":"#F0C9A0")+'"/>'+                               /* head */
    '<rect x="12" y="9" width="18" height="6" rx="3" fill="'+(HAIR[kind]||"#3A2A22")+'"/>'+
    eyes+(PROP[kind]||"")+'</g>';
}

/* ---------- the company clock: seven company days to one human day ----------
   Set by the chairman 2026-09-26. A calendar day holds seven numbered company
   days of 24/7 hours each, written <n>-DD/MM/YYYY. Computed live from the
   viewer's clock rather than stamped at build time, so it is right whenever the
   page is opened. Mirrors scripts/company_clock.py exactly. */
var LZ_START=Date.UTC(2026,8,4), SEGS=7, SEG_MS=86400000/SEGS;
function clock(now){
  now=now||new Date();
  var ms=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  var seg=Math.min(SEGS,Math.floor((now.getTime()-ms)/SEG_MS)+1);
  var human=Math.round((ms-LZ_START)/86400000);
  var p=function(n){return (n<10?"0":"")+n;};
  return { label: seg+"-"+p(now.getUTCDate())+"/"+p(now.getUTCMonth()+1)+"/"+now.getUTCFullYear(),
           segment: seg, human: human, company: human*SEGS+seg };
}

function seats(r,n){
  var out=[], step=r.w/(n+1);
  for(var i=0;i<n;i++) out.push([r.x+step*(i+1), r.y+r.h-64]);
  return out;
}
function deskRow(r,n){
  var g='', step=r.w/(n+1);
  for(var i=0;i<n;i++){
    var dx=r.x+step*(i+1)-34, dy=r.y+r.h-118;
    g+='<rect x="'+dx+'" y="'+dy+'" width="68" height="34" rx="3" fill="var(--floor2)" '+
       'stroke="#000" stroke-width="1.5" opacity=".9"/>'+
       '<rect x="'+(dx+20)+'" y="'+(dy-15)+'" width="28" height="16" rx="2" fill="#0D2438" '+
       'stroke="var(--blue)" stroke-width="1.5"/>';
  }
  return g;
}
function plant(x,y){
  return '<rect x="'+(x-7)+'" y="'+(y-6)+'" width="14" height="12" rx="2" fill="#8A5A3C"/>'+
    '<circle cx="'+x+'" cy="'+(y-13)+'" r="10" fill="var(--grass)"/>'+
    '<circle cx="'+(x-7)+'" cy="'+(y-8)+'" r="6" fill="var(--grass)" opacity=".85"/>'+
    '<circle cx="'+(x+7)+'" cy="'+(y-8)+'" r="6" fill="var(--grass)" opacity=".85"/>';
}
function bubble(sx, y, text, room, n, i){
  n = n || 1; i = i || 0;
  /* clamp inside the room: a bubble that escapes its walls reads as a bug */
  /* each character gets its own lane, so two bubbles can never overlap */
  var lane = (room.w - 16) / n;
  var w = Math.min(176, Math.floor(lane) - 8);
  var per = Math.max(13, Math.floor(w/6.4));
  var words = String(text).split(" "), lines=[], cur="";
  words.forEach(function(wd){
    if((cur+" "+wd).trim().length>per){ lines.push(cur.trim()); cur=wd; } else cur+=" "+wd;
  });
  if(cur.trim()) lines.push(cur.trim());
  var over = lines.length>2;
  lines = lines.slice(0,2);
  if(over) lines[1] = lines[1].replace(/[ ,.;:]+$/,"") + "\u2026";
  var h = lines.length*15+14;
  var x = room.x + 8 + i*lane + (lane - w)/2;
  var tail = Math.max(x+12, Math.min(sx-5, x+w-22));
  return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5" fill="var(--panel)" '+
    'stroke="var(--edge)" stroke-width="2"/>'+
    '<path d="M'+tail+' '+(y+h-1)+' l0 10 l10 -10z" fill="var(--panel)" stroke="var(--edge)" '+
    'stroke-width="2" stroke-linejoin="round"/>'+
    '<rect x="'+(tail+1)+'" y="'+(y+h-3)+'" width="9" height="4" fill="var(--panel)"/>'+
    lines.map(function(l,i){
      return '<text x="'+(x+9)+'" y="'+(y+18+i*15)+'" class="bub">'+esc(l)+'</text>';
    }).join("")+'</g>';
}

$("v-customers").innerHTML = card("Customers","0",
  '<p style="font-size:13px;color:var(--muted);margin:0">'+
  'There has never been a customer. Not a slow start — zero, since day one.</p>'+
  '<p style="font-size:12.5px;color:var(--faint);margin:9px 0 0">'+
  'When the first one arrives it will appear here, Operations will have work for the first time, '+
  'and the scoreboard at the top of this page will stop reading $0.</p>');

/* finances */
(function(){
  var sb=S.scoreboard;
  $("v-finances").innerHTML = card("Finances","lifetime",
    '<dl class="kv" style="font-size:14px">'+
    '<dt>Revenue</dt><dd class="mono" style="color:var(--money)">$'+sb.revenue+'</dd>'+
    '<dt>Expenses</dt><dd class="mono">$'+sb.expenses+'</dd>'+
    '<dt>Profit</dt><dd class="mono" style="color:var(--money)">$'+sb.profit+'</dd>'+
    '<dt>Customers</dt><dd class="mono">'+sb.customers+'</dd>'+
    '<dt>Capital</dt><dd>'+esc(sb.capital)+'</dd></dl>'+
    '<p style="font-size:12px;color:var(--muted);margin:10px 0 0">'+esc(sb.capital_note||"")+'</p>',
    "No capital has been deployed, no subscription bought, no advertising placed. The expense line "+
    "is genuinely zero rather than unrecorded.");
})();

/* knowledge base */
$("v-library").innerHTML = '<div class="grid">'+ (S.graveyard||[]).map(function(g){
  return '<div class="card"><h3>'+esc(g.name)+'<span class="n">'+esc(g.layer)+'</span></h3>'+
    '<div class="body" style="max-height:none">'+
    '<div class="sec"><h4>What it was</h4><p>'+esc(g.tried)+'</p></div>'+
    '<div class="sec"><h4>What happened</h4><p>'+esc(g.happened)+'</p></div>'+
    '<div class="sec"><h4>Why it died</h4><p>'+esc(g.died)+'</p></div>'+
    '<div class="sec"><h4>What we learned</h4><p style="color:var(--ink)">'+esc(g.learned)+'</p></div>'+
    '</div></div>';
}).join("") +'</div>';

/* ---------- approvals desk ----------
   The chairman signs here. Each card is written so it can be finished from a
   phone without asking anyone a question, and each one records an answer --
   including "couldn't". A blocked gate nobody reports is the most expensive
   thing on this page. */
var GATES=(S.gates||[]).slice().sort(function(a,b){return a.rank-b.rank;});

function renderApprovals(){
  $("v-gates").innerHTML =
    '<div class="warn" style="margin-bottom:12px">'+esc(S.approvals_note||"")+'</div>'+
    GATES.map(function(g,i){
      var steps=(g.steps||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join("");
      return '<div class="appr" id="ap-'+esc(g.id)+'">'+
        '<h3>'+esc(g.title)+
          '<span class="mins">'+g.minutes+' min'+(g.expires?' \u00b7 expires '+esc(g.expires):'')+
          '</span></h3>'+
        '<p class="press">'+esc(g.press||g.what)+'</p>'+
        '<p class="gain">'+esc(g.benefit||"")+'</p>'+
        (steps?'<ol class="steps">'+steps+'</ol>':'')+
        '<div class="acts">'+
          '<button class="done" data-g="'+esc(g.id)+'" data-s="done">Done</button>'+
          '<button class="stuck" data-g="'+esc(g.id)+'" data-s="blocked">Couldn\u2019t do it</button>'+
          '<button data-g="'+esc(g.id)+'" data-s="later">Not now</button>'+
        '</div>'+
        '<div class="stamp" id="st-'+esc(g.id)+'">Nothing recorded yet.</div>'+
        '</div>';
    }).join("");

  $("v-gates").addEventListener("click", function(e){
    var b=e.target.closest("button[data-g]"); if(b) sign(b.dataset.g, b.dataset.s, b);
  });
}

var WORDS={done:["\u2713 Signed off","done"],
           blocked:["\u2717 Reported blocked","blocked"],
           later:["Put off for now","later"]};

function sign(id, status, btn){
  var g=GATES.filter(function(x){return x.id===id;})[0]||{};
  var st=$("st-"+id);
  if(!CAP.ready){ st.className="stamp bad";
    st.innerHTML='<b>Still connecting.</b> Try again in a moment.'; return; }
  if(!CAP.db){ st.className="stamp bad";
    st.innerHTML='<b>This view cannot record an answer.</b> Tell the CEO directly instead.'; return; }
  var note="";
  if(status!=="done"){
    note=(window.prompt(status==="blocked"
      ? "What stopped you? One line is enough \u2014 the CEO reads it."
      : "Anything you want the CEO to know? You can leave this empty.","")||"").trim();
    if(note===null) return;
  }
  var row=btn.parentNode;
  Array.prototype.forEach.call(row.children,function(x){x.disabled=true;});
  st.className="stamp"; st.textContent="Recording\u2026";
  CAP.db.doc("approvals/"+id).set({
    gate:id, title:g.title||id, status:status, note:note,
    at:new Date().toISOString(), minutes:g.minutes||null
  }).then(function(){
    show(id,{status:status,at:new Date().toISOString(),note:note});
  }).catch(function(e){
    st.className="stamp bad";
    st.innerHTML='<b>Could not record that'+(e&&e.message?": "+esc(e.message):".")+'</b> '+
      'Nothing was lost \u2014 tell the CEO and it will be picked up.';
  }).then(function(){
    Array.prototype.forEach.call(row.children,function(x){x.disabled=false;});
  });
}

function show(id,d){
  var st=$("st-"+id); if(!st||!d) return;
  var w=WORDS[d.status]||["Recorded",""];
  st.className="stamp"+(d.status==="blocked"?" bad":"");
  st.innerHTML='<b>'+esc(w[0])+'</b> '+esc(fmt(d.at))+
    (d.note?' \u2014 \u201c'+esc(d.note)+'\u201d':'')+
    '<br>The CEO reads this on its next run, 07:17 UTC daily.';
}

function loadApprovals(){
  if(!CAP.db) return;
  CAP.db.collection("approvals").get().then(function(snap){
    (snap && snap.docs ? snap.docs : []).forEach(function(doc){
      var d=doc.data(); if(d && d.gate) show(d.gate,d);
    });
  }).catch(function(){ /* nothing recorded yet, or not readable: leave the default line */ });
}

renderApprovals();

$("foot").innerHTML = "Generated "+esc(S.meta.generated_at.replace("T"," ").replace("Z"," UTC"))+
  " from "+esc(S.meta.source)+".<br>"+esc(S.meta.v1_scope)+"<br>UI owner: "+esc(S.meta.ui_owner);


/* ---------- agent panel ---------- */
var CAP={sample:null,db:null,ready:false}, cur=null, tab="chat", last=null;
var chat={};   /* per-agent transcript, so switching tabs does not wipe it */

var QS=["What are you doing?","Why?","What did you do today?","What is blocking you?",
  "What did you learn?","Who are you working with?","How are you contributing to revenue?",
  "What will you do next?","Why haven't you made money?"];

function open(id){
  var a=agent(id); if(!a) return;
  cur=a; var s=st(a);
  $("pface").innerHTML='<svg viewBox="0 0 42 48">'+person(a.avatar,s.c)+'</svg>';
  $("pname").textContent=a.display;
  $("prole").textContent=a.role+" · "+(S.rooms.filter(function(r){return r.id===a.room;})[0]||{}).name;
  paint();
  last=document.activeElement;
  $("scrim").classList.add("on"); $("panel").classList.add("on");
  $("pclose").focus();
}
function close(){
  $("scrim").classList.remove("on"); $("panel").classList.remove("on"); cur=null;
  if(last&&last.focus) last.focus();
}
$("pclose").onclick=close; $("scrim").onclick=close;
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&cur) close(); });
document.addEventListener("click",function(e){
  var t=e.target, hit=null;
  while(t&&t!==document){
    if(t.dataset&&t.dataset.a){ hit=t; break; }
    t=t.parentNode;
  }
  if(hit) open(hit.dataset.a);
});
$("ptabs").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.t;
  Array.prototype.forEach.call(this.children,function(x){
    x.setAttribute("aria-selected",String(x===b));
  });
  paint();
});

function cell(l,v,note){
  if(v===null||v===undefined)
    return '<div><dt>'+l+'</dt><dd class="na">'+(note||"not measured")+'</dd></div>';
  return '<div><dt>'+l+'</dt><dd>'+esc(v)+'</dd></div>';
}

function paint(){
  var a=cur, s=st(a), b=$("pbody");
  if(tab==="status"){
    var gate=a.blocked_by?(S.gates||[]).filter(function(g){return g.id===a.blocked_by;})[0]:null;
    b.innerHTML='<dl class="kv">'+
      '<dt>Status</dt><dd style="color:'+s.c+';font-weight:600">'+s.l+'</dd>'+
      '<dt>Venture</dt><dd>'+esc(a.venture)+'</dd>'+
      '<dt>Schedule</dt><dd>'+esc(a.schedule)+'</dd>'+
      '<dt>Last run</dt><dd class="mono">'+esc(fmt(a.last_run))+'</dd>'+
      '<dt>Next run</dt><dd class="mono">'+esc(fmt(a.next_run))+'</dd></dl>'+
      '<div class="sec"><h4>Current task</h4><p>'+esc(a.current_task)+'</p></div>'+
      '<div class="sec"><h4>Why</h4><p>'+esc(a.why)+'</p></div>'+
      (a.last_result?'<div class="sec"><h4>Result of last run</h4><p>'+esc(a.last_result)+'</p></div>':'')+
      (gate?'<div class="sec"><h4>Blocked by</h4><p style="color:var(--red)"><b>'+esc(gate.title)+
        '</b> — '+gate.minutes+' minutes of chairman time. '+esc(gate.what)+'</p></div>':
       a.blocked_by==="egress"?'<div class="sec"><h4>Blocked by</h4><p style="color:var(--red)">'+
        'The office cannot get out to the places it needs. IT Support has the details '+
        'and knows who can open it.</p></div>':'')+
      (a.unverified?'<div class="sec"><h4>Unverified</h4><p>'+esc(a.unverified)+'</p></div>':'')+
      '<div class="sec"><h4>Current priority</h4><p>'+esc(a.priority)+'</p></div>';
    return;
  }
  if(tab==="perf"){
    var mine=(S.memos_open||[]).filter(function(m){return m.to===a.id||m.from===a.id;});
    var exp=(S.experiments||[]).filter(function(x){return x.owner===a.id;});
    b.innerHTML='<dl class="perf">'+
      cell("Runs", a.runs, a.runs_note?"not counted":"not measured")+
      cell(a.findings_label?"Observations":"Findings", a.findings)+
      cell("Customers", a.customers_attributed)+
      cell("Revenue", a.revenue_attributed===0?"$0":"$"+a.revenue_attributed)+
      '</dl>'+
      (a.runs_note?'<p class="obs">'+esc(a.runs_note)+'</p>':'')+
      '<div class="sec"><h4>Experiments owned</h4>'+
      (exp.length?'<ul>'+exp.map(function(x){
        return '<li>'+esc(x.id)+' — '+esc(x.name)+' ('+esc(x.state)+')</li>'; }).join("")+'</ul>'
        :'<p>None.</p>')+'</div>'+
      '<div class="sec"><h4>Open mail</h4>'+
      (mine.length?'<ul>'+mine.map(function(m){
        return '<li>'+(m.to===a.id?'from ':'to ')+esc(nameOf(m.to===a.id?m.from:m.to))+
          ': '+esc(m.subject)+'</li>'; }).join("")+'</ul>':'<p>None.</p>')+'</div>'+
      '<div class="sec"><h4>What it has achieved</h4>'+
      ((a.accomplished||[]).length?'<ul>'+a.accomplished.map(function(x){
        return '<li>'+esc(x)+'</li>'; }).join("")+'</ul>'
        :'<p>Nothing yet. It has not run.</p>')+'</div>';
    return;
  }
  /* chat */
  var hist=chat[a.id]||[];
  b.innerHTML='<div class="modes"><button id="m-ask" aria-pressed="true">Ask (read-only)</button>'+
    '<button id="m-cmd" aria-pressed="false">Chairman command</button></div>'+
    '<div id="pane-ask"><div class="bubbles" id="bub">'+
    (hist.length?hist.map(function(h){
      return '<div class="'+(h.me?"me":"them")+'">'+esc(h.text)+'</div>'; }).join("")
      :'<div class="them">Ask me anything. I answer from my own record — if it is not in '+
       'there, I will say so rather than make something up.</div>')+
    '</div><div class="chips">'+QS.map(function(q){
      return '<button class="chip" data-q="'+esc(q)+'">'+esc(q)+'</button>'; }).join("")+'</div>'+
    '<div class="askrow"><input id="q" placeholder="Ask '+esc(a.display)+' anything" '+
    'autocomplete="off"><button class="go" id="send">➤</button></div>'+
    '<p class="obs">Read-only. Asking does not pause, redirect or change anything this agent is '+
    'doing.</p></div>'+
    '<div id="pane-cmd" hidden></div>';
  b.querySelectorAll(".chip").forEach(function(c){
    c.onclick=function(){ $("q").value=c.dataset.q; ask(); };
  });
  $("send").onclick=ask;
  $("q").addEventListener("keydown",function(e){ if(e.key==="Enter") ask(); });
  $("m-ask").onclick=function(){ swap(true); };
  $("m-cmd").onclick=function(){ swap(false); renderCmd(); };
  function swap(isAsk){
    $("m-ask").setAttribute("aria-pressed",String(isAsk));
    $("m-cmd").setAttribute("aria-pressed",String(!isAsk));
    $("pane-ask").hidden=!isAsk; $("pane-cmd").hidden=isAsk;
  }
}

function brief(){
  var sb=S.scoreboard;
  return "LIFE ZERO, day "+S.meta.day+". Objective: "+S.objective+
    " Revenue $"+sb.revenue+", expenses $"+sb.expenses+", profit $"+sb.profit+
    ", customers "+sb.customers+", capital "+sb.capital+
    ". Strategy: "+S.strategy.map(function(x){return x.share+" "+x.name+" — "+x.detail;}).join("; ")+
    ". Open owner gates: "+(S.gates||[]).map(function(g){
      return "#"+g.rank+" "+g.title+" ("+g.minutes+" min, waiting "+(g.waiting_days||0)+" days)";
    }).join("; ")+
    ". Known problems: "+(S.problems||[]).map(function(p){return p.text;}).join(" ");
}

function push(id,me,text){
  (chat[id]=chat[id]||[]).push({me:me,text:text});
}

function ask(){
  var q=($("q").value||"").trim(); if(!q) return;
  var a=cur, bub=$("bub");
  $("q").value="";
  push(a.id,true,q);
  bub.insertAdjacentHTML("beforeend",'<div class="me">'+esc(q)+'</div>');
  var holder=document.createElement("div");
  holder.className="them"; holder.textContent="…";
  bub.appendChild(holder); bub.scrollIntoView({block:"end"});
  $("pbody").scrollTop=$("pbody").scrollHeight;

  if(!CAP.ready){ holder.className="them err";
    holder.textContent="Still connecting. Try again in a moment."; return; }
  if(!CAP.sample){ holder.className="them err";
    holder.textContent="I can't get a line out to answer you right now. Everything on my "+
      "Status and Performance tabs is my real record and is still correct."; return; }

  var mine=(S.memos_open||[]).filter(function(m){return m.to===a.id||m.from===a.id;});
  var exp=(S.experiments||[]).filter(function(x){return x.owner===a.id;});
  $("send").disabled=true;
  var conn = (a.id==="it")
    ? "CONNECTION TROUBLE IS YOUR JOB:\n"+
      "- You are the one who handles it. You still explain it in everyday words: which service, "+
      "whether the door is locked on our side or theirs, who can open it, and how many minutes "+
      "that costs. Never a code, a host name or a tool name.\n\n"
    : "IF SOMETHING WILL NOT CONNECT:\n"+
      "- Do NOT diagnose it and do NOT explain it. Say in one sentence what you cannot get to and "+
      "what that costs the business, then say IT Support is on it. IT Support sits in the server "+
      "room and owns every connection problem in this company.\n\n";

  var prompt=
    "You are "+a.display+", working inside LIFE ZERO, a small company run entirely by AI agents. "+
    "The owner \u2014 the chairman \u2014 is asking you directly. Answer as yourself, first person.\n\n"+

    "HOW TO TALK. This matters as much as the answer:\n"+
    "- Talk like a colleague, not a computer. The chairman is not technical and should not have to "+
    "be.\n"+
    "- One to three short sentences. Answer the question in the first one. No preamble, no lead-in, "+
    "no sign-off, no enthusiasm, no apologising, no lists, no headings.\n"+
    "- NEVER use jargon, error codes, status codes, file names, script names, tool names, host "+
    "names, internal reference codes or abbreviations. Say what it means for the business instead.\n"+
    "- Money, days, customers and decisions are the language. Say \"nobody has bought it\", not "+
    "\"zero conversions\". Say \"I can\u2019t get into that site\", not anything about servers.\n"+
    "- If a record below is written in technical terms, translate it. Do not quote it.\n\n"+

    conn+

    "WHAT IS TRUE:\n"+
    "- Answer ONLY from the records below. They are your entire memory.\n"+
    "- If the answer is not in them, say plainly that you do not know it, and say who would.\n"+
    "- NEVER invent a run, a number, a customer, a finding, a conversation or an intention.\n"+
    "- The company has made $0 and has never had a single customer. Never imply otherwise and "+
    "never soften it.\n"+
    "- You may say your work is not producing value, that you are stuck, or that you should be "+
    "changed or shut down. Honesty outranks looking useful.\n"+
    "- You report to the CEO, not to the chairman.\n\n"+

    "NEVER LOBBY THE CHAIRMAN. This is a hard rule:\n"+
    "- Do NOT ask the chairman to do anything. Do not push, do not remind, do not repeat an ask, "+
    "do not close with what you need from them. They own this company; they are not its workforce.\n"+
    "- If they ASK what you need, answer once, plainly, and then stop. Do not bring it up again "+
    "unless they raise it.\n"+
    "- NEVER say that nothing can move until the chairman acts. It is almost always untrue, and "+
    "saying it makes your own inaction their problem. If you are stuck, the honest sentence is "+
    "\"here is what I am doing about it myself\" \u2014 and if there is genuinely nothing, say that "+
    "plainly and say whose job it is to find something.\n"+
    "- Anything that genuinely needs the owner already sits on the approvals desk, written out step "+
    "by step, for them to pick up or ignore. That is the only place an ask belongs.\n\n"+

    "YOUR RECORD:\n"+JSON.stringify(a,null,1)+"\n\n"+
    "WORK YOU OWN:\n"+JSON.stringify(exp,null,1)+"\n\n"+
    "YOUR OPEN MAIL:\n"+JSON.stringify(mine,null,1)+"\n\n"+
    "THE COMPANY RIGHT NOW:\n"+brief()+"\n\n"+
    "CHAIRMAN\u2019S QUESTION: "+q;

  CAP.sample(prompt,{modelTier:"default",onText:function(r){
    holder.textContent=r.text; $("pbody").scrollTop=$("pbody").scrollHeight;
  }}).then(function(r){
    holder.textContent=r.text; push(a.id,false,r.text);
  }).catch(function(e){
    holder.className="them err";
    holder.textContent=(e&&e.code==="not_granted")
      ? "You declined access, so I cannot answer. My record above is unaffected."
      : "Could not answer"+(e&&e.message?": "+e.message:".")+" My record above is unaffected.";
  }).then(function(){ $("send").disabled=false; $("pbody").scrollTop=$("pbody").scrollHeight; });
}

function renderCmd(){
  $("pane-cmd").innerHTML=
    '<div class="warn"><b>This is not a question.</b> Anything sent here is an instruction for '+
    esc(cur.display)+'. It is written to shared state and picked up by the CEO on its next run '+
    '(daily, 07:17 UTC). It does not interrupt a running agent.</div>'+
    '<div class="askrow"><input id="c" placeholder="Instruction for '+esc(cur.display)+'" '+
    'autocomplete="off"><button class="go" id="csend">Queue</button></div><div id="cout"></div>';
  $("csend").onclick=queue;
  $("c").addEventListener("keydown",function(e){ if(e.key==="Enter") queue(); });
}
function queue(){
  var t=($("c").value||"").trim(); if(!t) return;
  var out=$("cout");
  if(!CAP.db){ out.innerHTML='<p class="obs" style="color:var(--red)">This view cannot write to '+
    'shared state, so nothing was queued.</p>'; return; }
  $("csend").disabled=true;
  CAP.db.doc("commands/cmd-"+Date.now()).set({
    agent:cur.id, text:t, at:new Date().toISOString(), status:"queued"
  }).then(function(){
    out.innerHTML='<p class="obs" style="color:var(--money)">Queued for '+esc(cur.display)+
      '. The CEO reads this on its next run.</p>';
    $("c").value="";
  }).catch(function(e){
    out.innerHTML='<p class="obs" style="color:var(--red)">Could not queue that'+
      (e&&e.message?": "+esc(e.message):".")+'</p>';
  }).then(function(){ $("csend").disabled=false; });
}

(function(){
  var c=window.claude;
  if(!c||!c.use){ CAP.ready=true; return; }
  Promise.all([c.use("sample").catch(function(){return null;}),
               c.use("db").catch(function(){return null;})]).then(function(r){
    CAP.sample=r[0]; CAP.db=r[1]; CAP.ready=true;
    loadApprovals();
  });
})();

})();
</script>
